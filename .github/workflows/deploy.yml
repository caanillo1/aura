# =============================================================================
# AURA ERP – Deploy Pipeline
# Deploy backend → VPS Windows (self-hosted runner)
# Deploy frontend → Vercel (integración Git nativa, automático en push a main)
# Ejecuta en: Push a main
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Qué desplegar'
        required: true
        default: 'backend'
        type: choice
        options:
          - backend

jobs:
  # ─── DEPLOY BACKEND → VPS (self-hosted runner) ───────────────────────────────
  deploy-backend:
    name: Deploy Backend → VPS
    runs-on: [self-hosted, Windows]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event.inputs.target == 'backend')

    defaults:
      run:
        shell: powershell

    steps:
      - name: Actualizar código desde GitHub
        run: |
          cd C:\AURA
          git fetch origin main
          git reset --hard origin/main
          Write-Host "✅ Código actualizado"

      - name: Detener backend
        run: |
          schtasks /run /TN "AURA-StopBackend"
          Start-Sleep 6
          Write-Host "✅ Backend detenido"

      - name: Instalar dependencias
        run: |
          cd C:\AURA
          pnpm install --no-frozen-lockfile
          Write-Host "✅ Dependencias instaladas"

      - name: Generar cliente Prisma
        run: |
          cd C:\AURA\apps\backend
          npx prisma generate
          Write-Host "✅ Cliente Prisma generado"

      - name: Compilar backend
        run: |
          cd C:\AURA
          pnpm --filter backend build
          Write-Host "✅ Backend compilado"

      - name: Reiniciar PM2
        run: |
          schtasks /run /TN "AURA-RestartBackend"
          Start-Sleep 8
          $result = schtasks /query /TN "AURA-RestartBackend" /FO LIST
          Write-Host $result
          Write-Host "✅ PM2 reiniciado via tarea programada"

  # ─── NOTIFY ─────────────────────────────────────────────────────────────────
  notify:
    name: Notificar resultado
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: always()

    steps:
      - name: Deploy exitoso
        if: needs.deploy-backend.result == 'success'
        run: echo "✅ Deploy AURA Backend completado exitosamente"

      - name: Deploy fallido
        if: needs.deploy-backend.result == 'failure'
        run: |
          echo "❌ Deploy backend falló — revisa los logs"
          exit 1
